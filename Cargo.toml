[workspace]
resolver = "3"
members = ["crates/lazybw", "crates/fake-bw"]

[workspace.package]
version = "1.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/SyscallBrain/lazybw"
authors = ["Tiago Correia"]
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0"
assert_fs = "1.1"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6", features = ["derive"] }
color-eyre = "0.6"
command-fds = { version = "0.3", features = ["tokio"] }
crossterm = { version = "0.29", features = ["event-stream"] }
directories = "6.0"
edtui = { version = "0.11", default-features = false }
http-body-util = "0.1"
hyper = { version = "1.12", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
insta = { version = "1.49", features = ["json"] }
libc = "0.2"
notify = "8.2"
nucleo-matcher = "0.3"
open = "5.4"
portable-pty = "0.9"
pretty_assertions = "1.4"
proptest = "1.6"
psl = "2.1"
ratatui = "0.30"
rustix = { version = "1.1", features = ["process", "fs", "stdio", "system", "termios"] }
secrecy = "0.10"
semver = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
ssh-key = { version = "0.6", features = ["ed25519", "rand_core", "getrandom", "encryption"] }
tachyonfx = "0.25"
tempfile = "3"
thiserror = "2.0"
tokio = { version = "1.54", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "process",
    "io-util",
    "net",
    "signal",
    "fs",
] }
toml = "1.1"
toml_edit = "0.25"
totp-rs = { version = "6.0", features = ["otpauth", "steam"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-segmentation = "1.13"
unicode-width = "0.2"
url = "2.5"
which = "8.0"
zeroize = { version = "1.9", features = ["derive"] }
zxcvbn = "3.1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
allow_attributes_without_reason = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
