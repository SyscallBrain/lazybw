<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64.00 64.00" role="img" aria-label="lazybw">
  <title>lazybw</title>

  <g transform="translate(0,0)">
    <!-- shackle -->
    <path d="M20.0,30.0 V20.0 a12.0,12.0 0 0 1 24.0,0 V30.0"
          fill="none" stroke="#7aa2f7" stroke-width="6.0" stroke-linecap="round"/>
    <!-- body: a terminal window -->
    <rect x="8.0" y="28.0" width="48.0" height="32.0" rx="6.0"
          fill="#24283b" stroke="#7aa2f7" stroke-width="3.0"/>
    <!-- title bar dots -->
    <circle cx="15.0" cy="34.0" r="1.6" fill="#414868"/>
    <circle cx="20.5" cy="34.0" r="1.6" fill="#414868"/>
    <circle cx="26.0" cy="34.0" r="1.6" fill="#414868"/>
    <!-- prompt chevron -->
    <path d="M16.0,41.0 L23.0,46.0 L16.0,51.0"
          fill="none" stroke="#9ece6a" stroke-width="3.4"
          stroke-linecap="round" stroke-linejoin="round"/>
    <!-- block cursor -->
    <rect x="28.0" y="48.0" width="12.0" height="4.0" rx="1.0" fill="#7dcfff"/>
  </g>
</svg>
