name: Official Bitwarden CLI compatibility

on:
  workflow_call:

permissions:
  contents: read

jobs:
  official-bw:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        bw-version: ['2025.9.0', '2026.10.1']
    env:
      RUST_VERSION: 1.99.1
      BW_VERSION: ${{ matrix.bw-version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - name: Check runner isolation and cleanup
        run: python3 -m unittest discover -s scripts -p test_check_bw.py
      - name: Install the official CLI into a temporary prefix
        run: |
          node --version
          npm install --prefix "$RUNNER_TEMP/official-bw" --cache "$RUNNER_TEMP/npm-cache" \
            --ignore-scripts --no-audit --no-fund "@bitwarden/cli@$BW_VERSION"
      - name: Check real CLI compatibility without an account
        run: python3 scripts/check-bw.py "$RUNNER_TEMP/official-bw/node_modules/.bin/bw" "$BW_VERSION"
