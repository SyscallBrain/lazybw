name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.99.1

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_VERSION"
      - name: Format, lints and tests (against fake-bw, never a real vault)
        run: scripts/check.sh
      - name: Build the release binary
        run: cargo build --release --locked -p lazybw

  # Licences, advisories, banned crates and sources (deny.toml).
  supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CARGO_DENY_VERSION: 0.20.2
      CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install a pinned cargo-deny
        run: |
          archive="cargo-deny-$CARGO_DENY_VERSION-x86_64-unknown-linux-musl.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/$CARGO_DENY_VERSION/$archive"
          echo "$CARGO_DENY_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" --strip-components=1
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: cargo deny check
        run: cargo deny check

  # The declared minimum Rust version must keep building.
  msrv:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.88
        run: |
          rustup toolchain install 1.88 --profile minimal
          rustup default 1.88
      - name: Build
        run: cargo build --locked --workspace --all-targets
