name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste passwords, notes or other vault contents. For a
        security problem, use a private advisory instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Press …
        2. …
  - type: textarea
    id: doctor
    attributes:
      label: Output of `lazybw doctor`
      description: Remove your email address if you prefer.
      render: text
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: Terminal emulator and version
      placeholder: kitty 0.40, inside tmux 3.5
